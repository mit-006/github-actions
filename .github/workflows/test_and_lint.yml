# Goal: To check if the python code is syntactically correct

name: Code Lint

on:
   workflow_call:

jobs:
  code-linter-and-test:

    strategy:
      matrix:
        python-version: [3.12,3.13,3.14]

    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ strategy.matrix.python_version}}
      
      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Code Lint
        run: ruff check .

      - name: run tests
        run: pytest